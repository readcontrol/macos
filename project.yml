name: ReadControl
options:
  bundleIdPrefix: app.readcontrol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown.git
    exactVersion: "0.8.0"
  # Sparkle drives in-app software updates (the "Check for Updates…" menu item and,
  # once the user opts in, periodic background checks). Distributed as a binary
  # XCFramework over SPM, so Xcode embeds and signs Sparkle.framework into the app
  # automatically — no manual "Embed Frameworks" phase needed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

targets:
  ReadControl:
    type: application
    platform: macOS
    sources:
      - Sources/ReadControl
      - path: GeneratedBindings
        optional: true   # populated by `make bindings`
    dependencies:
      - framework: Frameworks/ReadControlCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - package: Markdown
      - package: Sparkle
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.readcontrol.app
        PRODUCT_NAME: ReadControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/ReadControl/App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/GeneratedBindings
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/GeneratedBindings/readcontrol_coreFFI.modulemap
    entitlements:
      path: Sources/ReadControl/App/ReadControl.entitlements
    preBuildScripts:
      - name: Build and copy native-host
        script: |
          set -e
          # Xcode runs build phases with a sanitized PATH that omits ~/.cargo/bin,
          # so make cargo discoverable before invoking it.
          source "$HOME/.cargo/env" 2>/dev/null || export PATH="$HOME/.cargo/bin:$PATH"
          CORE="${SRCROOT}/../core"
          cargo build --release --manifest-path "${CORE}/Cargo.toml" --bin native-host
          SRC="${CORE}/target/release/native-host"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/native-host"
          cp "${SRC}" "${DST}"
          chmod +x "${DST}"
        inputFiles:
          - $(SRCROOT)/../core/native-host/src/main.rs
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/native-host

  # Fast, hostless unit tests for pure app logic: smart-view membership,
  # reading-time formatting, and the FFI-to-presentation ReadingRow mapper. It
  # compiles the specific files under test directly — the same way
  # ReadControlUITests shares AccessibilityID.swift — rather than hosting in the
  # app, so the suite never launches the app, opens a window, or touches the
  # dev's real library or defaults. The generated bindings and the static core
  # framework are linked because the code under test still meets the FFI
  # boundary: the mapper takes an `FfiReadingRow` and `SidebarItem.ffiView`
  # returns an `FfiView`.
  ReadControlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ReadControlTests
      - path: Sources/ReadControl/State/SidebarItem.swift
      - path: Sources/ReadControl/State/SidebarCounts.swift
      - path: Sources/ReadControl/State/ComposedFilter.swift
      - path: Sources/ReadControl/State/ReadingSort.swift
      - path: Sources/ReadControl/Shared/Formatting/ReadingTime.swift
      - path: Sources/ReadControl/Features/Tags/TagRules.swift
      # Reader typography: the preference vocabulary and the theme that derives
      # every measure/leading value from it. Pure value types, no FFI.
      - path: Sources/ReadControl/Shared/Preferences/TypographySettings.swift
      - path: Sources/ReadControl/Features/Reader/Markdown/MarkdownTheme.swift
      # The reading position: the anchors of an article (block index, quote,
      # progress), the parsed document they come from, and the text run that
      # reports where each block starts. Parsing and anchoring are pure logic —
      # no window, no app — so they belong in the hostless suite. They pull the
      # Markdown package and the inline renderers that turn a block into text.
      - path: Sources/ReadControl/Features/Reader/Article/ArticleAnchors.swift
      - path: Sources/ReadControl/Features/Reader/Article/ArticleDocument.swift
      # The rule that decides when the reader reached the end of an article,
      # which marks the reading read.
      - path: Sources/ReadControl/Features/Reader/Article/EndOfArticle.swift
      - path: Sources/ReadControl/Features/Reader/Markdown/IdentifiedMarkup.swift
      - path: Sources/ReadControl/Features/Reader/Markdown/MarkdownTextRun.swift
      - path: Sources/ReadControl/Features/Reader/Markdown/InlineRenderer.swift
      - path: Sources/ReadControl/Features/Reader/Markdown/AppKitInline.swift
      - path: Sources/ReadControl/Features/Reader/Markdown/ReaderTextView.swift
      # The reading-list row indicator: which of the dot, the ring, or nothing
      # a row shows. A pure choice over a row, rendered by the row view.
      - path: Sources/ReadControl/Features/ReadingList/ReadingIndicator.swift
      - path: Sources/ReadControl/Bridge/Mappers/ReadingRow.swift
      - path: Sources/ReadControl/Bridge/Mappers/SidebarCountModels.swift
      - path: Sources/ReadControl/Bridge/Mappers/HighlightRow.swift
      - path: Sources/ReadControl/Bridge/Mappers/SidebarItem+FFI.swift
      - path: Sources/ReadControl/Bridge/Mappers/ReadingSort+FFI.swift
      - path: Sources/ReadControl/Platform/Library/LibrarySetup.swift
      - path: Sources/ReadControl/Platform/NativeHost/NativeHostInstaller.swift
      - path: GeneratedBindings
        optional: true   # populated by `make bindings`
    dependencies:
      - framework: Frameworks/ReadControlCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      # The anchor tests parse Markdown, exactly as the reader does.
      - package: Markdown
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.readcontrol.app.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/GeneratedBindings
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/GeneratedBindings/readcontrol_coreFFI.modulemap

  # XCUITest end-to-end suite. Drives the real app as a separate process, and is
  # dependency-free (only Xcode + the macOS SDK). The app stays on Swift 6; this
  # target uses 5.0 to avoid strict-concurrency friction in XCTest code.
  ReadControlUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ReadControlUITests
      # Shared with the app target (it also lives under Sources/ReadControl/) so
      # tests and app compile the same accessibility identifiers.
      - path: Sources/ReadControl/AccessibilityID.swift
      # Likewise shared: the reader's typography vocabulary (font, size, width,
      # line height). Journeys assert against the same option labels and point
      # values the app renders, so neither can drift from the other.
      - path: Sources/ReadControl/Shared/Preferences/TypographySettings.swift
    dependencies:
      - target: ReadControl
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.readcontrol.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReadControl

# A shared scheme so `xcodebuild -scheme ReadControl` works from the command line
# and CI. Without this, xcodegen emits no scheme and only Xcode.app auto-creates
# a throwaway one under xcuserdata (not committed, wiped by `make clean`).
schemes:
  ReadControl:
    build:
      targets:
        ReadControl: all
    # Serial: UI tests steal keyboard focus, so parallel runs are flaky.
    # Per-test temp libraries keep future sharding open.
    test:
      config: Debug
      targets:
        # Unit tests first: they're fast and hostless, so a logic regression
        # fails the run before the slow UI suite even launches the app.
        - name: ReadControlTests
        - name: ReadControlUITests
          parallelizable: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
